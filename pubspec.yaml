name: inventory_management
description: A modern Inventory Management System built with Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.5

  # Database
  sqflite: ^2.4.2
  path: ^1.9.0
  path_provider: ^2.1.5

  # QR Code
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0

  # Charts
  fl_chart: ^1.2.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.4

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  sqflite_common_ffi_web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
